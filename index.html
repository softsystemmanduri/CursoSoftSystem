/* ===== Redesign profissional Soft System: vidro, 3D e animações ===== */
body{background:#04050e;background-image:none;font-family:'Nunito','Segoe UI',Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(40% 40% at 20% 20%,#3a4fd0aa,transparent 60%),radial-gradient(35% 35% at 82% 22%,#f2cf3a55,transparent 60%),radial-gradient(45% 45% at 62% 88%,#6d6fb8aa,transparent 60%),radial-gradient(30% 30% at 8% 82%,#e8883a44,transparent 60%);filter:blur(30px);animation:aur 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
@keyframes aur{to{transform:translate3d(4%,3%,0) scale(1.1) rotate(4deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:perspective(900px) rotateX(10deg) translateY(24px)}to{opacity:1;transform:none}}
@keyframes bob{50%{translate:0 -10px}}
@keyframes spin{to{rotate:360deg}}@keyframes spinr{to{rotate:-360deg}}
@keyframes spin3{to{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes drift{50%{translate:20px -30px}}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px #f2cf3a55,0 0 0 0 #f2cf3a55}50%{box-shadow:0 14px 40px #f2cf3a88,0 0 0 14px #f2cf3a00}}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fl3d{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#fl3d .sph{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fffa,#6d6fb8 35%,#141d66 78%);opacity:.32;animation:drift 14s ease-in-out infinite}
#fl3d .cub{position:absolute;width:90px;height:90px;border:1px solid #ffffff44;background:linear-gradient(135deg,#ffffff1c,#ffffff05);backdrop-filter:blur(3px);border-radius:14px;animation:spin3 26s linear infinite;opacity:.5}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0a0e2add,#0a0e2a99);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid #ffffff1f;box-shadow:0 10px 30px #0006}
header img{border-radius:12px;box-shadow:0 0 0 1px #ffffff22,0 0 26px #3a4fd099}
header>div>b{font-family:'Poppins',sans-serif;background:linear-gradient(90deg,#f2cf3a,#e8883a);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.25rem}
.ig,.rb,header .vsel,header .vozbtn{background:#ffffff14;backdrop-filter:blur(8px);border:1px solid #ffffff38;box-shadow:0 6px 18px #0005}
.rb:hover,.ig:hover{background:linear-gradient(135deg,#f2cf3a,#e8883a);color:#111;transform:translateY(-2px)}
.hero{position:relative}
.hero h1{font-family:'Poppins',sans-serif;background:linear-gradient(90deg,#fff,#f2cf3a 55%,#e8883a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero h1 span{background:linear-gradient(90deg,#f2cf3a,#e8883a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h2,h2{font-family:'Poppins',sans-serif}
.badge{background:linear-gradient(135deg,#e8883a,#f2cf3a);box-shadow:0 8px 22px #e8883a66;letter-spacing:.08em}
.chips span{background:#ffffff12;backdrop-filter:blur(10px);border:1px solid #ffffff2e;box-shadow:0 6px 16px #0004}
.cta{animation:pulse 2.6s infinite;border-radius:16px;font-family:'Poppins',sans-serif}
.logo3d{position:relative;width:min(330px,78%);margin:34px auto 30px;border-radius:30px;padding:10px;background:linear-gradient(145deg,#ffffff33,#ffffff08);border:1px solid #ffffff44;box-shadow:0 34px 70px #000b,0 0 70px #3a4fd077,inset 0 1px 0 #ffffff77;backdrop-filter:blur(12px);transition:transform .15s ease-out;animation:bob 6s ease-in-out infinite}
.logo3d img{width:100%;display:block;border-radius:22px}
.logo3d::after{content:"";position:absolute;inset:0;border-radius:30px;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff44,transparent 55%);pointer-events:none}
.orbit{position:absolute;inset:0;pointer-events:none;animation:spin 26s linear infinite}
.orbit .arm{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a))}
.orbit .arm i{position:absolute;left:min(215px,40vw);top:-18px;font-style:normal;font-size:1.9rem;transform:rotate(calc(var(--a)*-1));animation:spinr 26s linear infinite;filter:drop-shadow(0 8px 8px #000a)}
.grid{perspective:1200px}
.mod{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(145deg,#ffffff1f,#ffffff08);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid #ffffff2e;box-shadow:0 18px 40px #0007,inset 0 1px 0 #ffffff44;animation:fadeup .6s both;transition:transform .18s ease-out,border-color .2s,box-shadow .2s;will-change:transform}
.mod:hover,.mod:focus{border-color:#f2cf3a99;box-shadow:0 26px 54px #000a,0 0 34px #3a4fd066,inset 0 1px 0 #ffffff66}
.mod::before{content:attr(data-n);position:absolute;right:14px;top:4px;font-family:'Poppins',sans-serif;font-size:3.6rem;font-weight:800;color:#ffffff14;pointer-events:none}
.mod::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff2e,transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.mod:hover::after{opacity:1}
.mod b{font-family:'Poppins',sans-serif;font-size:1rem}
.ico3d{box-shadow:0 12px 24px #000a,inset 0 2px 0 #ffffffaa,inset 0 -6px 12px #0006,inset 0 0 0 1px #ffffff30}
.slide{background:linear-gradient(145deg,#ffffff22,#ffffff09);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid #ffffff2e;box-shadow:0 34px 80px #000b,inset 0 1px 0 #ffffff55;animation:enter .55s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
.slide h2{background:linear-gradient(90deg,#fff,#f2cf3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.slide ul{padding-left:0}
.slide li{list-style:none;position:relative;padding-left:38px;animation:fadeup .5s both}
.slide li::before{content:"✓";position:absolute;left:0;top:.12em;width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,#f2cf3a,#e8883a);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.8rem;box-shadow:0 4px 10px #e8883a77}
.slide li.pp{padding-left:0;margin-left:0}.slide li.pp::before{display:none}
.slide li:nth-child(1){animation-delay:.05s}.slide li:nth-child(2){animation-delay:.12s}.slide li:nth-child(3){animation-delay:.19s}.slide li:nth-child(4){animation-delay:.26s}.slide li:nth-child(5){animation-delay:.33s}.slide li:nth-child(6){animation-delay:.4s}.slide li:nth-child(7){animation-delay:.47s}
.bnr{position:relative;overflow:hidden;box-shadow:0 10px 26px #0007,inset 0 1px 0 #ffffff55;font-family:'Poppins',sans-serif}
.bnr::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff40 50%,transparent 70%);animation:shine 4.5s infinite;pointer-events:none}
.ban{background:linear-gradient(135deg,#3a4fd0aa,#14182966);backdrop-filter:blur(16px);border:1px solid #ffffff33;box-shadow:0 24px 50px #0008,inset 0 1px 0 #ffffff55;animation:enter .55s both}
.tag{font-family:'Poppins',sans-serif}
.bar{height:10px;background:#ffffff1a;box-shadow:inset 0 2px 4px #0006}
.bar div{background:linear-gradient(90deg,#f2cf3a,#e8883a);box-shadow:0 0 14px #f2cf3aaa}
button.b{background:linear-gradient(180deg,#ffe36e,#f2cf3a 50%,#e8a21a);color:#1a1200;font-family:'Poppins',sans-serif;font-weight:700;border-radius:14px;box-shadow:0 6px 0 #a8730f,0 16px 26px #0008;transition:transform .12s,box-shadow .12s,filter .12s}
button.b:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
button.b:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #a8730f,0 6px 12px #0008}
button.b.g{background:#ffffff1a;color:#fff;backdrop-filter:blur(10px);border:1px solid #ffffff38;box-shadow:0 8px 22px #0006}
.opt{background:#ffffff10;backdrop-filter:blur(10px);border:1px solid #ffffff2a;transition:transform .15s,border-color .15s,box-shadow .15s}
.opt:hover:not(:disabled){transform:translateX(8px);border-color:#f2cf3a;box-shadow:0 0 0 1px #f2cf3a55,0 12px 26px #0006}
.opt.ok{background:linear-gradient(90deg,#14532d,#166534);border-color:#4ade80;animation:pop .5s}
.opt.no{background:linear-gradient(90deg,#7f1d1d,#991b1b);border-color:#f87171;animation:shake .4s}
.fc .fa{background:linear-gradient(145deg,#3a4fd0cc,#141d66e6);box-shadow:0 18px 36px #000a,inset 0 1px 0 #ffffff55}
footer{background:#0a0e2a88;backdrop-filter:blur(10px)}
.pn{backdrop-filter:blur(12px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* correção de sobreposições */.logo3d{width:min(270px,70%);margin:112px auto}.orbit .arm i{left:min(185px,38vw);font-size:1.7rem}.hero>*:not(.logo3d){position:relative;z-index:2}.mod::before{z-index:0;top:auto;bottom:-8px;right:12px;font-size:4rem;color:#ffffff0c}.mod>*{position:relative;z-index:1}.mod::after{z-index:2}html{scroll-padding-top:120px}@media(max-width:600px){.logo3d{width:200px;margin:84px auto}.orbit .arm i{left:128px;font-size:1.4rem}}
.tbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}button.b.sm{padding:8px 16px;min-height:40px;font-size:.85rem}header .hm{cursor:pointer}header img{cursor:pointer}.help{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:linear-gradient(135deg,#f2cf3a,#e8883a);color:#111;border:0;border-radius:999px;padding:14px 20px;font:700 1rem "Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 6px 24px #000a}.pn{position:fixed;inset:0;background:#000b;z-index:60;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}.pc{background:#0d1020;border:1px solid #2c3366;border-radius:20px;max-width:640px;margin:0 auto;padding:20px}.pc h3{color:var(--y);margin:1em 0 .3em}details{background:#141829;border-radius:12px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;font-weight:700}details p{color:var(--mut);margin:.5em 0 0}textarea{width:100%;background:#141829;color:var(--ink);border:2px solid #23284a;border-radius:12px;padding:10px;font:inherit;margin:8px 0}.hero p{color:var(--mut);max-width:620px;margin:.4em auto}
.ig{margin-left:auto;color:var(--y);font-weight:700;text-decoration:none;border:2px solid var(--y);border-radius:999px;padding:8px 16px;font-size:.9rem;white-space:nowrap}.ig:hover{background:var(--y);color:#111}
footer{text-align:center;color:var(--mut);padding:24px 20px 40px;border-top:1px solid #23284a;font-size:.9rem}footer .ig{display:inline-block;margin:0}
@media(max-width:600px){header{flex-wrap:wrap}.ig{margin-left:0}}
@media(max-width:600px){body{font-size:18px}.slide{padding:18px}}
</style>

var Y=[
[["Entendendo a fundo: como o computador funciona",["¶Pense no computador como uma cozinha. O processador é o cozinheiro, a memória RAM é a bancada de trabalho e o HD ou SSD é a despensa, onde tudo fica guardado.","¶Quando você abre um programa, ele sai da despensa e vai para a bancada. Quanto maior a bancada (RAM), mais coisas você faz ao mesmo tempo sem travar."]],["Glossário: palavras que você vai ouvir",["<b>Hardware:</b> as peças que você pode tocar","<b>Software:</b> os programas, que você não toca","<b>Sistema operacional:</b> o programa principal, como Windows ou Android","<b>Aplicativo (app):</b> programa feito para uma tarefa"]],["Exercício: faça agora",["1. Ligue o computador ou o celular e espere carregar","2. Abra e feche um programa ou aplicativo 3 vezes","3. Use o botão Desligar do sistema, sem pressa","✔ Resultado esperado: você faz tudo isso sem ajuda"]]],
[["Entendendo a fundo: como as pastas se organizam",["¶Imagine um armário de escritório: o armário é o computador, cada gaveta é uma pasta e cada papel é um arquivo. Uma gaveta pode ter outras gavetas dentro, as subpastas.","¶Todo arquivo tem um nome e uma extensão, como foto.jpg ou carta.docx. A extensão mostra o tipo: JPG é imagem, DOCX é texto, MP3 é música e PDF é documento para ler."]],["Glossário: palavras que você vai ouvir",["<b>Extensão:</b> as letras no final do nome do arquivo","<b>Lixeira:</b> guarda o que foi apagado, até ser esvaziada","<b>Atalho:</b> ícone que abre algo sem mudar o local original","<b>Pendrive:</b> pequena memória para levar arquivos"]],["Exercício: faça agora",["1. Crie a pasta Meu Curso e, dentro dela, a subpasta Módulo 2","2. Salve um texto com o nome Treino","3. Apague o arquivo e restaure pela Lixeira","✔ Resultado esperado: você encontra tudo sem procurar"]]],
[["Entendendo a fundo: formatando um texto",["¶Formatar é deixar o texto bonito e fácil de ler sem mudar o que está escrito. Você escolhe a fonte (o desenho da letra), o tamanho, o negrito e o alinhamento.","¶Um bom documento tem título maior, parágrafos curtos e espaço entre eles. Para mudar algo, primeiro selecione o texto arrastando o mouse sobre ele."]],["Glossário: palavras que você vai ouvir",["<b>Fonte:</b> o estilo das letras","<b>Negrito:</b> letra mais grossa, para destacar","<b>Alinhamento:</b> esquerda, centro ou direita","<b>PDF:</b> formato que mantém o documento igual em qualquer aparelho"]],["Exercício: faça agora",["1. Escreva um bilhete de 5 linhas para um amigo","2. Deixe o título em negrito, maior e centralizado","3. Salve com o nome Bilhete e também em PDF","✔ Resultado esperado: um bilhete limpo e fácil de ler"]]],
[["Entendendo a fundo: como a internet funciona",["¶A internet é uma enorme rede que liga milhões de computadores. Quando você digita um endereço, seu aparelho pede a página a outro computador, o servidor, que a envia de volta em segundos.","¶Um endereço que começa com https e tem cadeado usa conexão protegida, mas isso não garante que o site seja confiável. Sempre confira o nome do site."]],["Glossário: palavras que você vai ouvir",["<b>Navegador:</b> programa para visitar sites, como o Chrome","<b>Link:</b> texto ou imagem que leva a outra página","<b>Phishing:</b> golpe que imita empresas para roubar dados","<b>Wi-Fi:</b> internet sem fio"]],["Exercício: faça agora",["1. Pesquise: previsão do tempo na minha cidade","2. Abra dois resultados e compare as informações","3. Procure o cadeado ao lado do endereço","✔ Resultado esperado: você pesquisa e confere a fonte sozinho"]]],
[["Entendendo a fundo: o endereço de e-mail",["¶O e-mail funciona como uma carta digital. O endereço tem duas partes separadas pelo @: o nome da pessoa, como maria, e o provedor, como gmail.com.","¶As mensagens ficam em pastas: Caixa de entrada (recebidas), Enviados, Rascunhos e Spam. Se algo importante sumir, olhe também no Spam."]],["Glossário: palavras que você vai ouvir",["<b>Anexo:</b> arquivo enviado junto com a mensagem","<b>Cc:</b> cópia para outra pessoa ver","<b>Spam:</b> mensagens indesejadas ou perigosas","<b>Grupo:</b> conversa com várias pessoas no WhatsApp"]],["Exercício: faça agora",["1. Envie um e-mail para você mesmo, com uma foto anexada","2. Abra o e-mail recebido e baixe o anexo","3. Faça uma chamada de vídeo com um familiar","✔ Resultado esperado: você se comunica sem medo"]]],
[["Entendendo a fundo: planilhas e fórmulas",["¶Uma planilha é uma tabela gigante. As colunas têm letras (A, B, C) e as linhas têm números (1, 2, 3). O encontro dos dois é a célula, como A1.","¶A grande vantagem é a fórmula: em vez de usar a calculadora, você diz à planilha quais células somar. Se um número mudar, o resultado muda sozinho."]],["Glossário: palavras que você vai ouvir",["<b>Célula:</b> um quadradinho, como B2","<b>Fórmula:</b> conta que começa com =","<b>Coluna e linha:</b> vertical e horizontal","<b>Slide:</b> uma tela de uma apresentação"]],["Exercício: faça agora",["1. Liste 5 gastos do mês em uma planilha","2. Some tudo com =SOMA e formate como moeda","3. Crie 3 slides: título, tópicos e encerramento","✔ Resultado esperado: seu controle de gastos funcionando"]]],
[["Entendendo a fundo: como a IA responde",["¶A inteligência artificial aprendeu lendo uma quantidade enorme de textos. Ela não pensa como uma pessoa: monta a resposta mais provável para o seu pedido.","¶Por isso o pedido (prompt) importa. Compare “faça um texto” com “faça um convite de aniversário curto e alegre para uma senhora de 70 anos”. O segundo gera uma resposta muito melhor."]],["Glossário: palavras que você vai ouvir",["<b>Prompt:</b> o pedido que você escreve","<b>Assistente de IA:</b> programa que conversa e ajuda","<b>Alucinação:</b> quando a IA inventa algo que parece verdadeiro","<b>Contexto:</b> informações extras que ajudam a IA"]],["Exercício: faça agora",["1. Peça uma receita simples com 3 ingredientes que você tem em casa","2. Peça para explicar de outro jeito, mais simples","3. Confira uma informação da resposta em outra fonte","✔ Resultado esperado: você pede, confere e melhora a resposta"]]],
[["Entendendo a fundo: o que o recrutador procura",["¶Quem seleciona candidatos lê dezenas de currículos e decide em segundos. Seja claro, organizado e honesto, e coloque o mais importante no começo.","¶Hoje, saber usar computador, e-mail, WhatsApp e IA já é um diferencial. Mostre isso com exemplos reais, como “organizei planilhas” ou “atendi clientes por e-mail”."]],["Glossário: palavras que você vai ouvir",["<b>Currículo:</b> resumo da sua vida profissional","<b>LinkedIn:</b> rede social profissional","<b>Candidatura:</b> pedido para participar de uma vaga","<b>gov.br:</b> portal com serviços públicos digitais"]],["Exercício: faça agora",["1. Escreva seu resumo profissional em 3 linhas","2. Liste 3 habilidades digitais que você aprendeu","3. Procure 3 vagas, leia os requisitos e salve seu currículo em PDF","✔ Resultado esperado: um currículo pronto para enviar"]]],
[["Entendendo a fundo: o que faz o desempenho",["¶O desempenho de um jogo depende do conjunto: processador, placa de vídeo, memória e SSD. Se uma peça é muito fraca, ela vira o gargalo e segura as outras.","¶FPS é quantos quadros por segundo o jogo mostra. Perto de 60 FPS, o jogo parece fluido. Temperatura alta e programas em segundo plano derrubam esse número."]],["Glossário: palavras que você vai ouvir",["<b>FPS:</b> quadros por segundo","<b>Gargalo:</b> peça que limita as outras","<b>Driver:</b> programa que ensina o Windows a usar uma peça","<b>Overclock:</b> forçar uma peça acima do normal, com riscos"]],["Exercício: faça agora",["1. Abra o Gerenciador de Tarefas e veja o uso de memória","2. Desative 2 programas na inicialização","3. Descubra o modelo da sua placa de vídeo","✔ Resultado esperado: você entende o que pesa no seu PC"]]],
[["Entendendo a fundo: como o dinheiro entra online",["¶Todo ganho online vem de alguém que paga por um serviço, produto ou conhecimento. Se ninguém recebe valor, não existe dinheiro real, e é aí que moram os golpes.","¶O caminho mais seguro é usar o que você já sabe fazer. Quem tem experiência com computadores, por exemplo, pode oferecer suporte, aulas e manutenção."]],["Glossário: palavras que você vai ouvir",["<b>Freelancer:</b> trabalha por serviço, sem emprego fixo","<b>Afiliado:</b> ganha comissão por vendas que indicou","<b>Pix:</b> pagamento instantâneo","<b>MEI:</b> forma de ter um CNPJ pequeno e legalizado"]],["Exercício: faça agora",["1. Liste 3 coisas que você sabe fazer bem","2. Escolha uma e escreva uma oferta em 2 linhas, com preço","3. Mostre a oferta para uma pessoa de confiança","✔ Resultado esperado: sua primeira oferta pronta"]]],
