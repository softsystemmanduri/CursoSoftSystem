[["Entendendo a fundo: como o computador funciona",["¶Pense no computador como uma cozinha. O processador é o cozinheiro, a memória RAM é a bancada de trabalho e o HD ou SSD é a despensa, onde tudo fica guardado.","¶Quando você abre um programa, ele sai da despensa e vai para a bancada. Quanto maior a bancada (RAM), mais coisas você faz ao mesmo tempo sem travar."]],["Glossário: palavras que você vai ouvir",["<b>Hardware:</b> as peças que você pode tocar","<b>Software:</b> os programas, que você não toca","<b>Sistema operacional:</b> o programa principal, como Windows ou Android","<b>Aplicativo (app):</b> programa feito para uma tarefa"]],["Exercício: faça agora",["1. Ligue o computador ou o celular e espere carregar","2. Abra e feche um programa ou aplicativo 3 vezes","3. Use o botão Desligar do sistema, sem pressa","✔ Resultado esperado: você faz tudo isso sem ajuda"]]],
[["Entendendo a fundo: como as pastas se organizam",["¶Imagine um armário de escritório: o armário é o computador, cada gaveta é uma pasta e cada papel é um arquivo. Uma gaveta pode ter outras gavetas dentro, as subpastas.","¶Todo arquivo tem um nome e uma extensão, como foto.jpg ou carta.docx. A extensão mostra o tipo: JPG é imagem, DOCX é texto, MP3 é música e PDF é documento para ler."]],["Glossário: palavras que você vai ouvir",["<b>Extensão:</b> as letras no final do nome do arquivo","<b>Lixeira:</b> guarda o que foi apagado, até ser esvaziada","<b>Atalho:</b> ícone que abre algo sem mudar o local original","<b>Pendrive:</b> pequena memória para levar arquivos"]],["Exercício: faça agora",["1. Crie a pasta Meu Curso e, dentro dela, a subpasta Módulo 2","2. Salve um texto com o nome Treino","3. Apague o arquivo e restaure pela Lixeira","✔ Resultado esperado: você encontra tudo sem procurar"]]],
[["Entendendo a fundo: formatando um texto",["¶Formatar é deixar o texto bonito e fácil de ler sem mudar o que está escrito. Você escolhe a fonte (o desenho da letra), o tamanho, o negrito e o alinhamento.","¶Um bom documento tem título maior, parágrafos curtos e espaço entre eles. Para mudar algo, primeiro selecione o texto arrastando o mouse sobre ele."]],["Glossário: palavras que você vai ouvir",["<b>Fonte:</b> o estilo das letras","<b>Negrito:</b> letra mais grossa, para destacar","<b>Alinhamento:</b> esquerda, centro ou direita","<b>PDF:</b> formato que mantém o documento igual em qualquer aparelho"]],["Exercício: faça agora",["1. Escreva um bilhete de 5 linhas para um amigo","2. Deixe o título em negrito, maior e centralizado","3. Salve com o nome Bilhete e também em PDF","✔ Resultado esperado: um bilhete limpo e fácil de ler"]]],
[["Entendendo a fundo: como a internet funciona",["¶A internet é uma enorme rede que liga milhões de computadores. Quando você digita um endereço, seu aparelho pede a página a outro computador, o servidor, que a envia de volta em segundos.","¶Um endereço que começa com https e tem cadeado usa conexão protegida, mas isso não garante que o site seja confiável. Sempre confira o nome do site."]],["Glossário: palavras que você vai ouvir",["<b>Navegador:</b> programa para visitar sites, como o Chrome","<b>Link:</b> texto ou imagem que leva a outra página","<b>Phishing:</b> golpe que imita empresas para roubar dados","<b>Wi-Fi:</b> internet sem fio"]],["Exercício: faça agora",["1. Pesquise: previsão do tempo na minha cidade","2. Abra dois resultados e compare as informações","3. Procure o cadeado ao lado do endereço","✔ Resultado esperado: você pesquisa e confere a fonte sozinho"]]],
[["Entendendo a fundo: o endereço de e-mail",["¶O e-mail funciona como uma carta digital. O endereço tem duas partes separadas pelo @: o nome da pessoa, como maria, e o provedor, como gmail.com.","¶As mensagens ficam em pastas: Caixa de entrada (recebidas), Enviados, Rascunhos e Spam. Se algo importante sumir, olhe também no Spam."]],["Glossário: palavras que você vai ouvir",["<b>Anexo:</b> arquivo enviado junto com a mensagem","<b>Cc:</b> cópia para outra pessoa ver","<b>Spam:</b> mensagens indesejadas ou perigosas","<b>Grupo:</b> conversa com várias pessoas no WhatsApp"]],["Exercício: faça agora",["1. Envie um e-mail para você mesmo, com uma foto anexada","2. Abra o e-mail recebido e baixe o anexo","3. Faça uma chamada de vídeo com um familiar","✔ Resultado esperado: você se comunica sem medo"]]],
[["Entendendo a fundo: planilhas e fórmulas",["¶Uma planilha é uma tabela gigante. As colunas têm letras (A, B, C) e as linhas têm números (1, 2, 3). O encontro dos dois é a célula, como A1.","¶A grande vantagem é a fórmula: em vez de usar a calculadora, você diz à planilha quais células somar. Se um número mudar, o resultado muda sozinho."]],["Glossário: palavras que você vai ouvir",["<b>Célula:</b> um quadradinho, como B2","<b>Fórmula:</b> conta que começa com =","<b>Coluna e linha:</b> vertical e horizontal","<b>Slide:</b> uma tela de uma apresentação"]],["Exercício: faça agora",["1. Liste 5 gastos do mês em uma planilha","2. Some tudo com =SOMA e formate como moeda","3. Crie 3 slides: título, tópicos e encerramento","✔ Resultado esperado: seu controle de gastos funcionando"]]],
[["Entendendo a fundo: como a IA responde",["¶A inteligência artificial aprendeu lendo uma quantidade enorme de textos. Ela não pensa como uma pessoa: monta a resposta mais provável para o seu pedido.","¶Por isso o pedido (prompt) importa. Compare “faça um texto” com “faça um convite de aniversário curto e alegre para uma senhora de 70 anos”. O segundo gera uma resposta muito melhor."]],["Glossário: palavras que você vai ouvir",["<b>Prompt:</b> o pedido que você escreve","<b>Assistente de IA:</b> programa que conversa e ajuda","<b>Alucinação:</b> quando a IA inventa algo que parece verdadeiro","<b>Contexto:</b> informações extras que ajudam a IA"]],["Exercício: faça agora",["1. Peça uma receita simples com 3 ingredientes que você tem em casa","2. Peça para explicar de outro jeito, mais simples","3. Confira uma informação da resposta em outra fonte","✔ Resultado esperado: você pede, confere e melhora a resposta"]]],
[["Entendendo a fundo: o que o recrutador procura",["¶Quem seleciona candidatos lê dezenas de currículos e decide em segundos. Seja claro, organizado e honesto, e coloque o mais importante no começo.","¶Hoje, saber usar computador, e-mail, WhatsApp e IA já é um diferencial. Mostre isso com exemplos reais, como “organizei planilhas” ou “atendi clientes por e-mail”."]],["Glossário: palavras que você vai ouvir",["<b>Currículo:</b> resumo da sua vida profissional","<b>LinkedIn:</b> rede social profissional","<b>Candidatura:</b> pedido para participar de uma vaga","<b>gov.br:</b> portal com serviços públicos digitais"]],["Exercício: faça agora",["1. Escreva seu resumo profissional em 3 linhas","2. Liste 3 habilidades digitais que você aprendeu","3. Procure 3 vagas, leia os requisitos e salve seu currículo em PDF","✔ Resultado esperado: um currículo pronto para enviar"]]],
[["Entendendo a fundo: o que faz o desempenho",["¶O desempenho de um jogo depende do conjunto: processador, placa de vídeo, memória e SSD. Se uma peça é muito fraca, ela vira o gargalo e segura as outras.","¶FPS é quantos quadros por segundo o jogo mostra. Perto de 60 FPS, o jogo parece fluido. Temperatura alta e programas em segundo plano derrubam esse número."]],["Glossário: palavras que você vai ouvir",["<b>FPS:</b> quadros por segundo","<b>Gargalo:</b> peça que limita as outras","<b>Driver:</b> programa que ensina o Windows a usar uma peça","<b>Overclock:</b> forçar uma peça acima do normal, com riscos"]],["Exercício: faça agora",["1. Abra o Gerenciador de Tarefas e veja o uso de memória","2. Desative 2 programas na inicialização","3. Descubra o modelo da sua placa de vídeo","✔ Resultado esperado: você entende o que pesa no seu PC"]]],
[["Entendendo a fundo: como o dinheiro entra online",["¶Todo ganho online vem de alguém que paga por um serviço, produto ou conhecimento. Se ninguém recebe valor, não existe dinheiro real, e é aí que moram os golpes.","¶O caminho mais seguro é usar o que você já sabe fazer. Quem tem experiência com computadores, por exemplo, pode oferecer suporte, aulas e manutenção."]],["Glossário: palavras que você vai ouvir",["<b>Freelancer:</b> trabalha por serviço, sem emprego fixo","<b>Afiliado:</b> ganha comissão por vendas que indicou","<b>Pix:</b> pagamento instantâneo","<b>MEI:</b> forma de ter um CNPJ pequeno e legalizado"]],["Exercício: faça agora",["1. Liste 3 coisas que você sabe fazer bem","2. Escolha uma e escreva uma oferta em 2 linhas, com preço","3. Mostre a oferta para uma pessoa de confiança","✔ Resultado esperado: sua primeira oferta pronta"]]],
[["Entendendo a fundo: por que o PC superaquece",["¶O computador gera calor e depende do ar para esfriar. A poeira vira uma manta sobre os coolers e as saídas de ar, o ar não passa e a temperatura sobe.","¶A pasta térmica fica entre o processador e o cooler e leva o calor adiante. Com os anos ela seca e perde o efeito, por isso trocá-la de tempos em tempos ajuda."]],["Glossário: palavras que você vai ouvir",["<b>Cooler:</b> ventilador que esfria as peças","<b>Pasta térmica:</b> gel que ajuda a passar o calor","<b>Slot:</b> encaixe onde se coloca uma peça","<b>Estática:</b> eletricidade que pode danificar peças"]],["Exercício: faça agora",["1. Desligue tudo e tire da tomada","2. Fotografe a parte de trás e os cabos","3. Limpe as saídas de ar com um pincel e religue","✔ Resultado esperado: equipamento mais silencioso e fresco"]]]
